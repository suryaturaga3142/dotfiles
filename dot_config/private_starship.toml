"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """$cmd_duration$container$python$username$hostname: $directory$git_branch $git_status\n $character """

# Colors defined by noctalia

[cmd_duration]
min_time = 2_000
format = "[ 󱦟  $duration]($style)\n\n"
#style = "bold yellow"

[container]
symbol = "󰏃 "
format = '[$symbol\[$name\] ]($style)'

[python]
#style = "bold cyan"
symbol = "󱔎 "
format = '[$symbol(\($virtualenv\)) ]($style)'
detect_extensions = []

[username]
show_always = true
#style_user = "bold green"
format = "[$user]($style)"

[hostname]
ssh_only = true
#style = "bold green"
detect_env_vars = [ "IS_CONTAINER" ]
format = "@[$hostname]($style)"

[directory]
#style = "bold blue"
truncation_length = 3
fish_style_pwd_dir_length = 1

[git_branch]
symbol = " "
#style = "bold yellow"
format = "([$symbol$branch]($style))"

[character]
success_symbol = "[❯](bold white)"
error_symbol = "[❯](bold red)"

# >>> NOCTALIA STARSHIP PALETTE >>>
